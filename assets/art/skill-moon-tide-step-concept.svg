<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" shape-rendering="crispEdges">
  <title>Moon Tide Step - Skill Concept Art</title>
  <desc>Pixel-art concept sheet for an unfinished dash pursuit player skill. Deep blue water-breathing slash, silver wave tips, moon tide motif, cyan afterimage trail.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#071020"/>
      <stop offset="0.48" stop-color="#101733"/>
      <stop offset="1" stop-color="#05070d"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0a3d82"/>
      <stop offset="0.35" stop-color="#0aa7df"/>
      <stop offset="0.7" stop-color="#e8fbff"/>
      <stop offset="1" stop-color="#45d9ff"/>
    </linearGradient>
    <linearGradient id="moon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5fbff"/>
      <stop offset="1" stop-color="#8bdfff"/>
    </linearGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>

  <!-- grid / sprite planning guides -->
  <g opacity="0.16" stroke="#1d6fa0" stroke-width="2">
    <path d="M80 140 H1200"/>
    <path d="M80 580 H1200"/>
    <path d="M160 80 V640"/>
    <path d="M1120 80 V640"/>
  </g>
  <text x="80" y="62" fill="#93dfff" font-size="28" font-family="monospace">Skill Concept: 月潮步 / Moon Tide Step</text>
  <text x="80" y="100" fill="#5ca8cf" font-size="18" font-family="monospace">unfinished normal skill direction: dash pursuit · water afterimage · moon-tide edge</text>

  <!-- moon glyph -->
  <g filter="url(#softGlow)" opacity="0.95">
    <circle cx="1040" cy="160" r="88" fill="url(#moon)"/>
    <circle cx="1074" cy="136" r="88" fill="#071020"/>
    <rect x="1012" y="208" width="8" height="8" fill="#d9f7ff"/>
    <rect x="980" y="178" width="6" height="6" fill="#bceeff"/>
    <rect x="1095" y="222" width="5" height="5" fill="#9fe8ff"/>
  </g>

  <!-- large crescent water arc -->
  <g filter="url(#softGlow)">
    <path d="M186 478 C330 306 502 236 670 254 C812 270 930 334 1057 448 L1014 494 C894 389 784 336 660 322 C512 304 370 358 235 520 Z" fill="#072a5a" opacity="0.95"/>
    <path d="M214 457 C350 312 514 264 656 282 C792 300 906 354 1030 462 L1000 488 C878 392 782 348 654 334 C518 319 388 362 258 515 Z" fill="url(#water)"/>
    <path d="M306 458 C438 372 535 348 655 360 C768 371 854 414 946 488 C814 436 720 416 616 418 C498 420 402 448 306 458 Z" fill="#effcff" opacity="0.82"/>
    <path d="M710 268 L756 254 L738 286 Z" fill="#f7fdff"/>
    <path d="M846 325 L902 310 L874 350 Z" fill="#eafcff"/>
    <path d="M980 431 L1045 418 L1008 462 Z" fill="#eafcff"/>
  </g>

  <!-- dash afterimage ribbon -->
  <g opacity="0.78">
    <path d="M154 496 C250 444 360 412 482 404 L472 434 C350 448 254 486 168 532 Z" fill="#07356f"/>
    <path d="M135 540 C260 520 380 500 520 512 L510 540 C370 538 252 554 142 576 Z" fill="#0e88c1"/>
    <path d="M198 392 C302 364 416 352 532 368 L516 396 C398 386 306 398 214 430 Z" fill="#0fbdea"/>
    <rect x="266" y="554" width="18" height="8" fill="#dffaff"/>
    <rect x="346" y="386" width="14" height="7" fill="#dffaff"/>
    <rect x="450" y="518" width="22" height="8" fill="#78eaff"/>
    <rect x="560" y="358" width="18" height="8" fill="#c8f7ff"/>
  </g>

  <!-- player silhouette / key pose -->
  <g transform="translate(590 310)">
    <!-- afterimage -->
    <g opacity="0.28" transform="translate(-72 24)">
      <rect x="-32" y="66" width="46" height="82" fill="#19caff"/>
      <rect x="-18" y="18" width="34" height="48" fill="#d7f3ff"/>
      <path d="M0 84 L120 40 L130 56 L20 122 Z" fill="#ccefff"/>
    </g>
    <!-- body -->
    <rect x="-18" y="74" width="48" height="84" fill="#071426"/>
    <rect x="-12" y="78" width="36" height="70" fill="#102a54"/>
    <rect x="-20" y="96" width="56" height="24" fill="#0d6ea8"/>
    <rect x="-10" y="22" width="38" height="48" fill="#f0dbc2"/>
    <rect x="-16" y="14" width="50" height="26" fill="#221c25"/>
    <rect x="-36" y="72" width="26" height="74" fill="#0b3d79"/>
    <rect x="24" y="82" width="28" height="70" fill="#0b3d79"/>
    <rect x="-36" y="146" width="32" height="58" fill="#0a0e1b"/>
    <rect x="20" y="146" width="32" height="58" fill="#0a0e1b"/>
    <rect x="-48" y="202" width="52" height="18" fill="#151824"/>
    <rect x="30" y="202" width="58" height="18" fill="#151824"/>
    <!-- arm and blade -->
    <rect x="30" y="90" width="74" height="18" fill="#f0dbc2"/>
    <rect x="94" y="86" width="150" height="10" fill="#dff8ff"/>
    <rect x="244" y="82" width="118" height="6" fill="#74e6ff"/>
    <rect x="362" y="78" width="42" height="4" fill="#f7fdff"/>
    <rect x="82" y="104" width="44" height="12" fill="#2a2431"/>
    <!-- hair and haori water edge pixels -->
    <rect x="-28" y="36" width="12" height="58" fill="#16131d"/>
    <rect x="30" y="38" width="12" height="50" fill="#16131d"/>
    <rect x="-30" y="152" width="8" height="16" fill="#7ee8ff"/>
    <rect x="32" y="150" width="8" height="16" fill="#bdf7ff"/>
    <rect x="-2" y="160" width="8" height="20" fill="#64ddff"/>
  </g>

  <!-- impact target marker -->
  <g transform="translate(1015 445)" opacity="0.9">
    <path d="M0 56 C36 40 66 42 104 60 C70 78 32 80 0 56 Z" fill="#08223d"/>
    <path d="M18 50 C44 38 70 42 92 56 C62 66 36 68 18 50 Z" fill="#42caff"/>
    <rect x="50" y="4" width="8" height="82" fill="#dffaff"/>
    <rect x="18" y="30" width="72" height="8" fill="#dffaff"/>
    <rect x="30" y="16" width="8" height="8" fill="#f7fdff"/>
    <rect x="72" y="72" width="8" height="8" fill="#f7fdff"/>
  </g>

  <!-- small frame thumbnails at bottom -->
  <g transform="translate(80 625)" font-family="monospace" font-size="14" fill="#86dfff">
    <text x="0" y="0">animation key:</text>
    <g transform="translate(0 18)">
      <rect width="120" height="44" fill="#0b1830" stroke="#2478a8"/>
      <path d="M16 28 C42 12 70 12 104 30" stroke="#43dfff" stroke-width="6" fill="none"/>
      <text x="8" y="62">1 windup</text>
    </g>
    <g transform="translate(150 18)">
      <rect width="120" height="44" fill="#0b1830" stroke="#2478a8"/>
      <path d="M10 32 C48 8 74 10 116 34" stroke="#bff8ff" stroke-width="7" fill="none"/>
      <rect x="62" y="16" width="20" height="20" fill="#102a54"/>
      <text x="8" y="62">2 launch</text>
    </g>
    <g transform="translate(300 18)">
      <rect width="120" height="44" fill="#0b1830" stroke="#2478a8"/>
      <path d="M4 34 C52 8 90 8 120 24" stroke="#43dfff" stroke-width="8" fill="none"/>
      <rect x="86" y="12" width="18" height="22" fill="#102a54"/>
      <text x="8" y="62">3 dash</text>
    </g>
    <g transform="translate(450 18)">
      <rect width="120" height="44" fill="#0b1830" stroke="#2478a8"/>
      <path d="M8 34 C50 30 82 16 116 8" stroke="#eaffff" stroke-width="7" fill="none"/>
      <text x="8" y="62">4 strike</text>
    </g>
    <g transform="translate(600 18)">
      <rect width="120" height="44" fill="#0b1830" stroke="#2478a8"/>
      <path d="M14 30 C44 38 84 32 112 18" stroke="#1588c9" stroke-width="6" fill="none"/>
      <text x="8" y="62">5 recover</text>
    </g>
  </g>
</svg>
